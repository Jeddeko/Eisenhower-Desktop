name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        working-directory: ./eisenhower-desktop

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./eisenhower-desktop

      - name: Upload Installer and Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Eisenhower-Portable
          path: |
            ./eisenhower-desktop/src-tauri/target/release/bundle/msi/*.msi
            ./eisenhower-desktop/src-tauri/target/release/bundle/nsis/*.exe
            ./eisenhower-desktop/src-tauri/target/release/eisenhower-desktop.exe